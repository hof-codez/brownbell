name: Trade Calculator Seed

on:
  schedule:
    # Daily at 5 AM AZ (12:00 UTC): picks up trades, adds and drops
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @supabase/supabase-js@^2.45.0
      - name: Sync trade calculator assets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLEEPER_LEAGUE_ID: ${{ secrets.SLEEPER_LEAGUE_ID }}
        run: node tc-seed.js
