# .github/workflows/check-egress-anomalies.yml
# Supabase's Free plan keeps detailed request logs for roughly a day, while
# the egress usage graph itself keeps the whole billing cycle's history.
# That gap means a spike is always eventually visible, but by the time
# someone notices it on an infrequent glance at the dashboard, the
# "which endpoint actually caused it" data has usually already aged out.
# This runs daily specifically to stay inside that window - see
# check-egress-anomalies.js for the full reasoning and the actual check.
name: Check for egress anomalies

on:
  schedule:
    # 9 AM AZ (4 PM UTC) - well after the prior day's traffic has settled,
    # comfortably before that day's log window expires.
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Run anomaly check
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node check-egress-anomalies.js

      # Same pattern as update-standings.yml's own failure alert - a highly
      # visible GitHub Issue rather than relying on email notifications.
      # Repeat detections comment on the same open issue rather than
      # spamming a new one each day.
      - name: Alert on anomaly detected
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'egress-anomaly';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Detected again: ${runUrl}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '⚠️ Unusually high request volume to a Supabase endpoint',
                body: `One or more endpoints exceeded the daily request threshold - check the run's log output for which one.\n\nRun: ${runUrl}\n\nThis is the same pattern that caused the original egress overage (one endpoint refetching far more than it should, usually from an unstable useEffect dependency). This issue stays open until closed manually - close it once you've confirmed the cause and a fix is deployed.`,
                labels: [label]
              });
            }
