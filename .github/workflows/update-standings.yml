# .github/workflows/update-standings.yml
# Runs the automation on its usual checkpoint schedule. As of the 2026 rebuild, the
# automation writes directly to Supabase - there's no data file to commit back to the
# repo and no GitHub Pages deploy step, since the frontend is a separate React app on
# Netlify that reads from Supabase itself.
name: Update Brown Bell Standings

on:
  schedule:
    # --- Standalone checkpoints (outside any game-day window) ---
    # Tuesday at 10 AM ET (7 AM AZ) - 2 PM UTC - weekly cleanup
    - cron: '0 14 * * 2'
    # Tuesday at 12 PM AZ (7 PM UTC) - guaranteed weekly recap checkpoint.
    # By this point the week is always long since finalized (the Monday
    # night watchdog above should already have generated it hours
    # earlier), so this exists purely as a backstop - if that watchdog
    # window somehow missed catching the week's finalization (a delayed
    # Monday night game, an unusual schedule that week, etc.), this
    # guarantees the recap exists by a fixed, predictable time every
    # week regardless, matching Sleeper's own weekly report cadence
    # (Sleeper sends theirs at 12 PM ET Tuesdays) so there's always
    # something ready to share on the same reliable schedule.
    - cron: '0 19 * * 2'
    # Thursday at 2:30 PM AZ (9:30 PM UTC) - pre-TNF injury checkpoint
    - cron: '30 14 * * 4'
    # Saturday at 4 AM AZ (11 AM UTC) - international game prep
    - cron: '0 11 * * 6'
    # Sunday at 4 AM AZ (11 AM UTC) - pre-international games
    - cron: '0 11 * * 0'
    # Monday at 2:30 PM AZ (9:30 PM UTC) - post-game cleanup
    - cron: '30 14 * * 1'

    # --- Watchdog-start triggers, one per chunk of a game window. These
    # fire ONCE per chunk (not every 15 min) and start watchdog.js, which
    # loops internally every 15 min for the rest of that chunk's duration.
    #
    # This replaces a previous */15-per-window design that turned out to
    # be unreliable in practice: GitHub's own docs state the `schedule`
    # trigger "can be delayed during periods of high loads... if the load
    # is sufficiently high enough, some queued jobs may be dropped" -
    # confirmed directly via a real production report where a 15-minute
    # schedule was actually firing every ~90-120 minutes during a live
    # Sunday NFL window, matching widely-reported community experience of
    # the exact same symptom with other high-frequency schedules. A
    # already-STARTED job is not subject to that same scheduling-queue
    # delay - the delay is specifically in starting a new scheduled run,
    # not in how long one that's already running takes - so this moves
    # the 15-minute cadence into watchdog.js's own internal loop instead
    # of trying to make GitHub start a new run every 15 minutes.
    #
    # Minutes are deliberately off the top/half of the hour (e.g. :07,
    # :37) rather than :00/:30, since GitHub's own community has reported
    # exactly this as reducing contention - most scheduled workflows
    # across all of GitHub fire on round minutes, so avoiding those marks
    # means competing with fewer other jobs for the same scheduling
    # window.
    #
    # Each chunk is sized to run for up to 330 minutes (5.5 hours) -
    # safely under GitHub Actions' 6-hour job time limit, leaving margin
    # for a slow iteration or a delayed start. A window longer than that
    # (the full ~16-hour Saturday/Sunday slate) needs multiple chunks
    # chained back to back, each one's start time picking up exactly
    # where the previous chunk's coverage ends - see the corresponding
    # WATCHDOG_DURATION_MINUTES value picked for each trigger below, in
    # the job step.
    #
    # Every chunk below runs for 340 minutes (5h40m) - deliberately well
    # under GitHub Actions' own HARD 360-minute (6 hour) per-job execution
    # cap on hosted runners. That cap cannot be raised, only lowered, no
    # matter what timeout-minutes or WATCHDOG_DURATION_MINUTES says - a
    # real mistake caught and corrected here: an earlier version of this
    # schedule set WATCHDOG_DURATION_MINUTES to 390, which GitHub would
    # have silently killed at the 350-minute timeout-minutes mark every
    # time, never actually reaching its own intended target.
    #
    # Each start time is also shifted 1 hour earlier than the game slot
    # it's meant to cover - a deliberate buffer against GitHub Actions'
    # own schedule trigger being "best effort" with no guaranteed bound.
    # Confirmed directly, twice: a trigger meant to fire at kickoff time
    # actually started over 4 hours late once, and about 2 hours late
    # another time - both apparently coinciding with high platform-wide
    # load right at common scheduling moments (the top of the hour). This
    # doesn't fix that underlying unreliability, it just gives more
    # margin before it actually matters.
    #
    # Wednesday/Thursday/Monday (single-game nights) each now get a
    # second chained chunk too, extending total coverage to ~11.3 hours -
    # a deliberate choice to add insurance against an unusually delayed
    # trigger, even though a single game's own realistic duration (~3.5
    # hours) is already comfortably covered by chunk 1 alone; chunk 2
    # mostly just sits idle correctly detecting "no game in progress."
    #
    # The chained Saturday/Sunday/multi-chunk sequences below overlap the
    # prior chunk's own coverage by about an hour, rather than starting
    # exactly when it ends - two overlapping runs are harmless
    # (update-standings.js always fetches fresh and upserts, never
    # appends) but do use somewhat more Actions minutes during that
    # overlap.
    #
    # Wednesday night (early-season kickoff game slot), 2 chunks covering ~22:07 UTC Wed -> ~09:27 UTC Thu
    - cron: '7 22 * * 3'    # chunk 1: 22:07 -> 03:47 (Thu)
    - cron: '47 3 * * 4'    # chunk 2: 03:47 -> 09:27 (Thu)
    # Thursday night, 2 chunks covering ~22:07 UTC Thu -> ~09:27 UTC Fri
    - cron: '7 22 * * 4'    # chunk 1: 22:07 -> 03:47 (Fri)
    - cron: '47 3 * * 5'    # chunk 2: 03:47 -> 09:27 (Fri)
    # Saturday (late-season Saturday games), 3 chunks covering ~12:07 UTC Sat -> ~05:07 UTC Sun
    - cron: '7 12 * * 6'    # chunk 1: 12:07 -> 17:47
    - cron: '47 17 * * 6'   # chunk 2: 17:47 -> 23:27
    - cron: '27 23 * * 6'   # chunk 3: 23:27 -> ~05:07 (Sun)
    # Sunday, all games including early internationals through SNF, 3 chunks covering ~12:07 UTC Sun -> ~05:07 UTC Mon
    - cron: '7 12 * * 0'    # chunk 1: 12:07 -> 17:47
    - cron: '47 17 * * 0'   # chunk 2: 17:47 -> 23:27
    - cron: '27 23 * * 0'   # chunk 3: 23:27 -> ~05:07 (Mon)
    # Monday night, 2 chunks covering ~22:07 UTC Mon -> ~09:27 UTC Tue
    - cron: '7 22 * * 1'    # chunk 1: 22:07 -> 03:47 (Tue)
    - cron: '47 3 * * 2'    # chunk 2: 03:47 -> 09:27 (Tue)

  # Allow manual triggering
  workflow_dispatch:
    inputs:
      force_substitutions:
        description: 'Force generate substitutions'
        required: false
        default: false
        type: boolean
      pregame_check:
        description: 'Run pre-game injury check'
        required: false
        default: false
        type: boolean
      international_check:
        description: 'Run international game injury check'
        required: false
        default: false
        type: boolean

jobs:
  update-standings:
    runs-on: ubuntu-latest
    # Explicit rather than relying on GitHub's default 360-min job timeout -
    # the watchdog's own longest chunk runs for up to 330 min internally,
    # so this needs real margin above that for checkout/setup/npm ci and
    # any single iteration running a little long, without silently getting
    # killed mid-window by an implicit limit nobody set on purpose.
    timeout-minutes: 350
    # Needed for the failure-alerting step below to create/comment on issues.
    permissions:
      issues: write
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm ci

    - name: Run automation
      env:
        SLEEPER_LEAGUE_ID: ${{ secrets.SLEEPER_LEAGUE_ID }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        NFL_SEASON_YEAR: ${{ vars.NFL_SEASON_YEAR }}
        FORCE_SUBSTITUTIONS: ${{ inputs.force_substitutions }}
        PREGAME_CHECK: ${{ inputs.pregame_check }}
        INTERNATIONAL_CHECK: ${{ inputs.international_check }}
        CRON_SCHEDULE: ${{ github.event.schedule }}
      # Routes to watchdog.js (an internal 15-min loop for the rest of
      # this chunk's duration) for the 9 watchdog-start triggers above, or
      # straight to update-standings.js for everything else (the 5
      # standalone one-shot checkpoints, and manual/workflow_dispatch
      # triggers - a manual click doesn't need a loop, it's already an
      # immediate, one-time check). WATCHDOG_DURATION_MINUTES is a
      # uniform 340 minutes for all 12 watchdog-start triggers - safely
      # under GitHub's hard 360-minute per-job cap (see the schedule
      # comment above for why this number specifically), so every chunk
      # uses the same value rather than needing separate groups.
      run: |
        case "$CRON_SCHEDULE" in
          "7 22 * * 3"|"47 3 * * 4"|"7 22 * * 4"|"47 3 * * 5"|"7 12 * * 6"|"47 17 * * 6"|"27 23 * * 6"|"7 12 * * 0"|"47 17 * * 0"|"27 23 * * 0"|"7 22 * * 1"|"47 3 * * 2")
            export WATCHDOG_DURATION_MINUTES=340
            node watchdog.js
            ;;
          *)
            node update-standings.js
            ;;
        esac

    # Runs ONLY when the automation step above actually fails. Doesn't rely
    # on GitHub's own email notifications (which may or may not be reaching
    # anyone, and weren't caught in time during the recent Node 20 outage) -
    # this creates a highly visible, impossible-to-miss GitHub Issue instead,
    # using nothing but the token Actions already provides. Repeat failures
    # comment on the SAME open issue rather than spamming a new one each
    # time - close the issue manually once a fix is confirmed working.
    - name: Alert on failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const label = 'automation-failure';
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

          const existing = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: label
          });

          if (existing.data.length > 0) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.data[0].number,
              body: `Failed again: ${runUrl}`
            });
          } else {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '\ud83d\udea8 Brown Bell automation is failing',
              body: `The scheduled automation run failed.\n\nFailed run: ${runUrl}\n\nThis issue stays open (and future failures get logged as comments here, not new issues) until it's closed manually - close it once you've confirmed a fix actually works.`,
              labels: [label]
            });
          }
