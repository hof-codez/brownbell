# .github/workflows/update-standings.yml
# Runs the automation on its usual checkpoint schedule. As of the 2026 rebuild, the
# automation writes directly to Supabase - there's no data file to commit back to the
# repo and no GitHub Pages deploy step, since the frontend is a separate React app on
# Netlify that reads from Supabase itself.
name: Update Brown Bell Standings

on:
  schedule:
    # --- Standalone checkpoints (outside any game-day window) ---
    # Tuesday at 10 AM ET (7 AM AZ) - 2 PM UTC - weekly cleanup
    - cron: '0 14 * * 2'
    # Thursday at 2:30 PM AZ (9:30 PM UTC) - pre-TNF injury checkpoint
    - cron: '30 14 * * 4'
    # Saturday at 4 AM AZ (11 AM UTC) - international game prep
    - cron: '0 11 * * 6'
    # Sunday at 4 AM AZ (11 AM UTC) - pre-international games
    - cron: '0 11 * * 0'
    # Monday at 2:30 PM AZ (9:30 PM UTC) - post-game cleanup
    - cron: '30 14 * * 1'

    # --- 15-minute live-score windows, one per game day. These fire every
    # 15 min inside a GENEROUS window covering the full range kickoff could
    # land in across the season (Arizona doesn't observe DST, but Eastern
    # Time does, so the ET->UTC offset shifts by an hour partway through the
    # season - these windows are padded wide enough to not care which side
    # of that shift we're on). The job itself (see update-standings.js's
    # LIVE_CHECK handling) checks whether a game is ACTUALLY in progress
    # before doing any real work, so a 15-min wake-up during a dead gap -
    # e.g. after an early international game ends but before the noon
    # games start - costs almost nothing and does nothing. This replaces
    # several of the old single-fixed-time checkpoints that fell inside
    # these windows anyway.
    #
    # Thursday night: ~23:00 UTC Thu -> ~05:00 UTC Fri
    - cron: '*/15 23 * * 4'
    - cron: '*/15 0-4 * * 5'
    # Sunday, all games including early internationals: ~13:00 UTC Sun -> ~05:00 UTC Mon
    - cron: '*/15 13-23 * * 0'
    - cron: '*/15 0-4 * * 1'
    # Monday night: ~23:00 UTC Mon -> ~05:00 UTC Tue
    - cron: '*/15 23 * * 1'
    - cron: '*/15 0-4 * * 2'

  # Allow manual triggering
  workflow_dispatch:
    inputs:
      force_substitutions:
        description: 'Force generate substitutions'
        required: false
        default: false
        type: boolean
      pregame_check:
        description: 'Run pre-game injury check'
        required: false
        default: false
        type: boolean
      international_check:
        description: 'Run international game injury check'
        required: false
        default: false
        type: boolean

jobs:
  update-standings:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Run automation
      env:
        SLEEPER_LEAGUE_ID: ${{ secrets.SLEEPER_LEAGUE_ID }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        NFL_SEASON_YEAR: ${{ vars.NFL_SEASON_YEAR }}
        FORCE_SUBSTITUTIONS: ${{ inputs.force_substitutions }}
        PREGAME_CHECK: ${{ inputs.pregame_check }}
        INTERNATIONAL_CHECK: ${{ inputs.international_check }}
        CRON_SCHEDULE: ${{ github.event.schedule }}
      run: node update-standings.js
